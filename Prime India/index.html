<html lang="en">
 <head>

  <style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:radial-gradient(circle at 20% 30%,#0f172a,#020617);overflow:hidden;
    font-family:'Segoe UI','Inter',system-ui,Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:#e2e8f0}

  #overlay{position:fixed;inset:0;background:radial-gradient(circle at 30% 40%,#0b1120,#020617);z-index:9999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;backdrop-filter:blur(4px)}
  #overlay svg{animation:spin 1s linear infinite;filter:drop-shadow(0 0 12px #38bdf8)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #overlay p{color:#94a3b8;font-size:13px;letter-spacing:1px;text-align:center;padding:0 24px;font-weight:500;
    text-shadow:0 2px 10px rgba(56,189,248,.3);animation:pulse-text 2s infinite}
  @keyframes pulse-text{0%,100%{opacity:1}50%{opacity:.6}}

  #channel-list{position:fixed;inset:0;background:radial-gradient(circle at 80% 10%,#0f172a,#020617);z-index:9998;
    display:none;flex-direction:column;overflow-y:auto;
    padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom)) 18px;
    scrollbar-width:thin;scrollbar-color:#38bdf8 #0a0f1a}
  #channel-list::-webkit-scrollbar{width:5px}
  #channel-list::-webkit-scrollbar-track{background:#0a0f1a}
  #channel-list::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#38bdf8,#a78bfa);border-radius:10px}

  #ch-header{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;padding-bottom:18px;
    border-bottom:1px solid rgba(56,189,248,.2);position:relative;flex-wrap:wrap}
  .brand-dot{width:10px;height:10px;border-radius:50%;background:#38bdf8;flex-shrink:0;
    box-shadow:0 0 16px #38bdf8,0 0 32px #38bdf8;animation:brand-pulse 2.2s ease-in-out infinite}
  @keyframes brand-pulse{0%,100%{opacity:1;box-shadow:0 0 16px #38bdf8,0 0 32px #38bdf8}
    50%{opacity:.6;box-shadow:0 0 28px #a78bfa,0 0 48px #a78bfa}}
  #ch-header h1{color:#f1f5f9;font-size:18px;font-weight:700;letter-spacing:1.2px;
    background:linear-gradient(135deg,#e0f2fe,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;text-shadow:0 0 30px rgba(56,189,248,.3)}
  #header-stats{color:#64748b;font-size:11px;font-weight:500;letter-spacing:.4px;
    background:rgba(56,189,248,.08);padding:4px 12px;border-radius:20px;
    border:1px solid rgba(56,189,248,.15);white-space:nowrap}

  .search-wrapper{position:relative;margin-bottom:18px;width:100%;max-width:500px;margin-left:auto;margin-right:auto}
  .search-wrapper input{width:100%;padding:14px 20px 14px 48px;background:rgba(15,23,42,.9);
    border:2px solid rgba(56,189,248,.25);border-radius:60px;font-size:15px;color:#f1f5f9;outline:none;
    transition:all .3s cubic-bezier(.4,0,.2,1);font-weight:500;letter-spacing:.3px;backdrop-filter:blur(10px);
    box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .search-wrapper input::placeholder{color:#64748b;font-weight:400}
  .search-wrapper input:focus{border-color:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.15),0 8px 32px rgba(56,189,248,.2);
    background:rgba(15,23,42,.95)}
  .search-wrapper svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;
    fill:#38bdf8;opacity:.8;pointer-events:none;transition:opacity .2s}
  .search-wrapper input:focus+svg{opacity:1}

  #ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;transition:all .2s}

  /* ═══════════ MATCH CARD ═══════════ */
  .ch-card{background:linear-gradient(145deg,rgba(30,41,59,.7),rgba(15,23,42,.8));
    border:1px solid rgba(56,189,248,.12);border-radius:16px;cursor:pointer;text-decoration:none;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
    transition:all .25s cubic-bezier(.4,0,.2,1);-webkit-tap-highlight-color:transparent;
    backdrop-filter:blur(4px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .ch-card:hover{border-color:rgba(56,189,248,.4);transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(56,189,248,.15),0 0 0 1px rgba(56,189,248,.2)}
  .ch-card:active{transform:scale(.97);transition:transform .08s}
  .ch-card:focus-visible{outline:2px solid #38bdf8;outline-offset:3px}
  .ch-card.is-upcoming{cursor:not-allowed;opacity:.85}
  .ch-card.is-upcoming:hover{transform:translateY(-1px);border-color:rgba(251,191,36,.4);
    box-shadow:0 8px 22px rgba(251,191,36,.12),0 0 0 1px rgba(251,191,36,.2)}

  .ch-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0f172a;
    transition:transform .35s}
  .ch-card:hover .ch-thumb{transform:scale(1.03)}
  .ch-thumb-empty{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#1e293b,#0f172a);
    display:flex;align-items:center;justify-content:center;font-size:32px;color:#38bdf8;opacity:.4}

  .card-badge{position:absolute;top:10px;left:10px;z-index:3;padding:4px 10px;border-radius:8px;
    font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:5px;
    box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .card-badge.live{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;animation:live-pulse 1.8s infinite}
  .card-badge.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;
    box-shadow:0 0 8px #fff;animation:live-dot 1.2s infinite}
  .card-badge.upcoming{background:rgba(15,23,42,.85);color:#fbbf24;
    border:1px solid rgba(251,191,36,.5)}
  @keyframes live-pulse{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 12px rgba(220,38,38,.4)}
    50%{box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 20px rgba(220,38,38,.7)}}
  @keyframes live-dot{0%,100%{opacity:1}50%{opacity:.4}}

  .ch-time{position:absolute;bottom:calc(100% - 80px - 42px);right:10px;z-index:2;
    padding:3px 8px;border-radius:6px;font-size:9px;font-weight:600;letter-spacing:.3px;
    background:rgba(0,0,0,.75);color:#cbd5e1;backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.1);
    max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    top: auto; bottom: 8px;}

  .ch-body{padding:10px 12px 14px;width:100%;text-align:left}
  .ch-title{color:#e2e8f0;font-size:11.5px;font-weight:600;line-height:1.35;letter-spacing:.15px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    text-shadow:0 1px 3px rgba(0,0,0,.5)}

  .no-results{grid-column:1/-1;text-align:center;padding:48px 20px;color:#64748b;font-size:15px;font-weight:500;
    background:rgba(15,23,42,.5);border-radius:18px;border:1px dashed rgba(56,189,248,.2);backdrop-filter:blur(4px)}
  .no-results svg{width:48px;height:48px;fill:#38bdf8;opacity:.4;margin-bottom:12px}

  #pc{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;touch-action:manipulation}
  video{width:100%;height:100%;object-fit:contain;background:#000}
  video.mode-fill{object-fit:fill}
  video.mode-cover{object-fit:cover}

  #status{position:fixed;top:max(14px,env(safe-area-inset-top));right:12%;transform:translateY(-10px);z-index:9997;
    display:flex;align-items:center;gap:7px;padding:8px 18px 8px 14px;background:rgba(10,15,26,.95);
    border:1px solid rgba(56,189,248,.2);font-size:12px;font-weight:500;letter-spacing:.3px;border-radius:30px;
    pointer-events:none;opacity:0;transition:opacity .3s ease,transform .3s ease;backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;
    box-shadow:0 4px 24px rgba(0,0,0,.6),0 0 0 1px rgba(56,189,248,.08)}
  #status.show{opacity:1;transform:translateY(0)}
  .st-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
  #status.ok{color:#b0c4de}
  #status.ok .st-dot{background:#60a5fa;box-shadow:0 0 10px #60a5fa}
  #status.live{color:#b8e6d9}
  #status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite;box-shadow:0 0 10px #22d3a0}
  #status.warn{color:#fde68a}
  #status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite;box-shadow:0 0 10px #fb923c}
  #status.err{color:#fca5a5}
  #status.err .st-dot{background:#f87171;box-shadow:0 0 10px #f87171}
  @keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.55)}}

  .sp-btn{background:transparent!important;border:none!important;cursor:pointer!important;padding:0 10px!important;
    opacity:.8;display:flex;align-items:center;justify-content:center;height:100%;min-width:38px;
    transition:opacity .15s,color .15s,transform .1s;color:#fff!important;-webkit-tap-highlight-color:transparent}
  .sp-btn:hover{opacity:1;color:#38bdf8!important}
  .sp-btn:active{opacity:1;transform:scale(.9)}
  .sp-btn:focus-visible{outline:2px solid #38bdf8;outline-offset:2px;border-radius:8px}
  .sp-btn.active{opacity:1;color:#38bdf8!important}
  .sp-fit-btn{padding:0 8px!important;min-width:auto!important}
  .fit-pill{font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 8px;border-radius:6px;line-height:1;
    border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);pointer-events:none;white-space:nowrap;
    transition:border-color .25s,color .25s,background .25s;background:rgba(0,0,0,.35)}
  .sp-fit-btn:hover .fit-pill{border-color:rgba(56,189,248,.6);color:#fff}
  .sp-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8;background:rgba(56,189,248,.1)}
  .sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,.1)}
  .shaka-controls-container button{color:#fff!important}
  .shaka-video-container{background-color:#000!important}

  /* ═══════════ SHAKA QUALITY MENU FIX ═══════════ */
  .shaka-overflow-menu,
  .shaka-settings-menu {
    background: #0f172a !important; color: #e2e8f0 !important;
    border: 1px solid rgba(56,189,248,.25) !important;
    border-radius: 12px !important;
    box-shadow: 0 12px 40px rgba(0,0,0,.75) !important;
  }
  .shaka-overflow-menu button,
  .shaka-settings-menu button,
  .shaka-overflow-menu .shaka-overflow-menu-item,
  .shaka-settings-menu .shaka-settings-menu-item {
    color: #e2e8f0 !important; background: transparent !important;
  }
  .shaka-overflow-menu button:hover,
  .shaka-settings-menu button:hover,
  .shaka-overflow-menu button:focus,
  .shaka-settings-menu button:focus {
    background: rgba(56,189,248,.12) !important; color: #38bdf8 !important;
  }
  .shaka-overflow-menu button:checked,
  .shaka-settings-menu button:checked,
  .shaka-overflow-menu button.shaka-selected,
  .shaka-settings-menu button.shaka-selected { color: #38bdf8 !important; }
  .shaka-overflow-menu span,
  .shaka-settings-menu span,
  .shaka-overflow-menu .shaka-overflow-menu-item span,
  .shaka-settings-menu .shaka-settings-menu-item span { color: #e2e8f0 !important; }
  .shaka-overflow-menu button:checked span,
  .shaka-settings-menu button:checked span,
  .shaka-overflow-menu .shaka-selected span,
  .shaka-settings-menu .shaka-selected span { color: #38bdf8 !important; }
  .shaka-overflow-menu svg, .shaka-settings-menu svg { fill: #e2e8f0 !important; }
  .shaka-overflow-menu button:checked svg,
  .shaka-settings-menu button:checked svg { fill: #38bdf8 !important; }
  .shaka-settings-menu .shaka-back-to-overflow-button,
  .shaka-overflow-menu .shaka-back-to-overflow-button { color: #38bdf8 !important; }
  .shaka-settings-menu .shaka-back-to-overflow-button svg,
  .shaka-overflow-menu .shaka-back-to-overflow-button svg { fill: #38bdf8 !important; }
  .shaka-overflow-menu-container,
  .shaka-settings-menu-container { z-index: 100 !important; }

  @media (max-width:480px){
    #ch-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .ch-body{padding:8px 10px 12px}
    .ch-title{font-size:10.5px}
    #ch-header h1{font-size:16px}
    .search-wrapper input{padding:12px 16px 12px 42px;font-size:14px}
    .search-wrapper svg{left:14px;width:18px;height:18px}
    .fit-pill{font-size:9px;padding:3px 6px}
    .sp-btn{padding:0 6px!important}
    #status{right:8%;font-size:11px;padding:6px 14px 6px 10px}
    .card-badge{font-size:8px;padding:3px 8px}
    .ch-time{font-size:8px;padding:2px 6px}
  }
  @media (max-width:380px){
    #ch-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
    .fit-pill{font-size:8px;padding:2px 5px}
  }
</style>
 </head>
 <body>
  <div id="overlay">
   <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#1e293b" stroke-width="4" /> <path d="M20 4a16 16 0 0 1 16 16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
   </svg>
   <p id="loadMsg">Loading.....</p>
  </div>
  <div id="status"></div>
  <div id="channel-list">
   <div id="ch-header">
    <span class="brand-dot"></span>
    <h1>Prime Video Live By @Thala66</h1>
    <span id="header-stats">—</span>
   </div>
   <div class="search-wrapper">
    <svg viewBox="0 0 24 24">
     <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
    </svg>
    <input type="text" id="channelSearch" placeholder="Search matches..." autocomplete="off" spellcheck="false">
   </div>
   <div id="ch-grid"></div>
  </div>
  <div id="pc">
   <video id="v" playsinline webkit-playsinline preload="none" x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/shaka-player.ui.min.js"></script>
  <script>
    (function(){
      "use strict";

      /* ═══════════ API CONFIG — PRIME VIDEO INDIA ═══════════ */
      var API = "https://raw.githubusercontent.com/doctor-8trange/tekzya9/refs/heads/main/data/primevideoindia.json";

      var $overlay = document.getElementById("overlay");
      var $loadMsg = document.getElementById("loadMsg");
      var $status  = document.getElementById("status");
      var $list    = document.getElementById("channel-list");
      var $grid    = document.getElementById("ch-grid");
      var $pc      = document.getElementById("pc");
      var $vid     = document.getElementById("v");
      var $search  = document.getElementById("channelSearch");
      var $stats   = document.getElementById("header-stats");
      var _stTmr   = null;
      var _allChannels = [];

      /* ═══════════ HELPERS ═══════════ */
      function getMatchId(m){ return m.titleId || ''; }

      function getMatchTitle(m){
        return (m.title || m.eventTitle || (m.catalogMetadata && m.catalogMetadata.catalog && m.catalogMetadata.catalog.title) || 'Untitled Match');
      }

      function getMatchThumb(m){
        if(m.images && m.images.boxArtImageFragments && m.images.boxArtImageFragments.mediaCentralUrl){
          return m.images.boxArtImageFragments.mediaCentralUrl;
        }
        if(m.images && m.images.coverImageFragments && m.images.coverImageFragments.mediaCentralUrl){
          return m.images.coverImageFragments.mediaCentralUrl;
        }
        if(m.catalogMetadata && m.catalogMetadata.images && m.catalogMetadata.images.coverImage){
          return m.catalogMetadata.images.coverImage;
        }
        return "";
      }

      function getMatchTime(m){
        return (m.liveSchedule && m.liveSchedule.timeBadge) || '';
      }

      function isMatchLive(m){
        return !!(m.liveSchedule && m.liveSchedule.status === 'LIVE');
      }

      function getStreamUrl(m){
        if(m.playback_details && Array.isArray(m.playback_details.playback_url) && m.playback_details.playback_url.length > 0){
          return m.playback_details.playback_url[0].url || '';
        }
        return "";
      }

      /* ═══════════ BUILD CLEAR KEYS from clearkey_pairs ═══════════ */
      function buildClearKeys(m){
        var out = {};
        if(m.playback_details && Array.isArray(m.playback_details.clearkey_pairs)){
          m.playback_details.clearkey_pairs.forEach(function(entry){
            if(typeof entry !== 'string') return;
            var parts = entry.split(':');
            if(parts.length >= 2 && parts[0] && parts[1]){
              out[parts[0].trim().toLowerCase()] = parts[1].trim().toLowerCase();
            }
          });
        }
        return out;
      }

      function getTier(){
        var mem   = navigator.deviceMemory || 4;
        var cores = navigator.hardwareConcurrency || 4;
        var mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var net   = conn ? (conn.effectiveType || "4g") : "4g";
        if(!mob) return "high";
        if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
        if(mem <= 3   || cores <= 4) return "mid";
        return "high";
      }

      var TIER = getTier();
      var PROF = {
        low:  {buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000 },
        mid:  {buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000},
        high: {buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000}
      }[TIER];

      var FITS       = ["contain","fill","cover"];
      var FIT_LABELS = {contain:"Fit", fill:"Fill", cover:"Zoom"};

      function toast(msg, type, dur){
        $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
        $status.className = "show " + (type || "ok");
        if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
        if(dur !== 0){
          _stTmr = setTimeout(function(){
            $status.className = $status.className.replace("show","").trim();
            _stTmr = null;
          }, dur || 4000);
        }
      }

      function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }
      function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }
      function getChId()    { return new URLSearchParams(location.search).get("id") || ""; }

      function isNonEmpty(v){
        return typeof v === "string" && v.trim().length > 0;
      }

      /* ═══════════ LOAD DATA ═══════════ */
      async function loadData(){
        var r = await fetch(API, {cache:"no-store"});
        if(!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();

        var all = [];
        if(Array.isArray(d.live)){
          d.live.forEach(function(m){ m._live = true; all.push(m); });
        }
        if(Array.isArray(d.upcoming)){
          d.upcoming.forEach(function(m){ m._live = false; all.push(m); });
        }

        /* Live matches first, then upcoming */
        all.sort(function(a,b){
          if(a._live !== b._live) return a._live ? -1 : 1;
          return 0;
        });

        var liveCount = d.live_matches || all.filter(function(m){ return m._live; }).length;
        var upCount   = d.upcoming_matches || all.filter(function(m){ return !m._live; }).length;
        if($stats) $stats.textContent = liveCount + ' LIVE · ' + upCount + ' UPCOMING';

        console.log('🎬 Loaded ' + all.length + ' matches (' + liveCount + ' live, ' + upCount + ' upcoming)');

        return { channels: all };
      }

      /* ═══════════ RENDER MATCH CARDS ═══════════ */
      function renderChannels(channels){
        $grid.innerHTML = "";
        if(!channels || channels.length === 0){
          $grid.innerHTML = '<div class="no-results"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><br>No matches found</div>';
          return;
        }

        var f = document.createDocumentFragment();
        channels.forEach(function(m){
          var a = document.createElement("a");
          a.className = "ch-card" + (m._live ? "" : " is-upcoming");
          a.href = "?id=" + encodeURIComponent(getMatchId(m));

          var thumb = getMatchThumb(m);
          var time  = getMatchTime(m);
          var title = getMatchTitle(m);
          var isLive = m._live;

          var badgeHtml = isLive
            ? '<span class="card-badge live">Live</span>'
            : '<span class="card-badge upcoming">Upcoming</span>';

          var thumbHtml = isNonEmpty(thumb)
            ? '<img class="ch-thumb" src="'+thumb+'" alt="" loading="lazy" referrerpolicy="no-referrer" '+
              'onerror="this.style.display=\'none\';this.nextElementSibling&&(this.nextElementSibling.style.display=\'flex\')">'+
              '<div class="ch-thumb-empty" style="display:none">⚡</div>'
            : '<div class="ch-thumb-empty">⚡</div>';

          var timeHtml = isNonEmpty(time) ? '<span class="ch-time">'+time+'</span>' : '';

          a.innerHTML = badgeHtml + thumbHtml + timeHtml +
            '<div class="ch-body"><div class="ch-title">' + title + '</div></div>';

          if(!isLive){
            a.addEventListener('click', function(e){
              e.preventDefault();
              toast(time ? '⏰ Starts ' + time : 'Match not live yet', 'warn', 4000);
            });
          }

          f.appendChild(a);
        });

        $grid.appendChild(f);
      }

      function filterChannels(query){
        if(!query || !query.trim()){
          renderChannels(_allChannels);
          return;
        }
        var q = query.trim().toLowerCase();
        var filtered = _allChannels.filter(function(m){
          return getMatchTitle(m).toLowerCase().indexOf(q) !== -1;
        });
        renderChannels(filtered);
      }

      function renderList(channels){
        hideOverlay();
        _allChannels = channels;
        renderChannels(channels);
        $list.style.display = "flex";
      }

      function errMsg(msg){
        setMsg(msg);
        $overlay.style.display = "flex";
        toast(msg, "err", 0);
      }

      function shakaErrStr(e){
        if(!e) return "Playback Error";
        var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
        var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
        if(e.data && e.data[0] && typeof e.data[0] === "string")
          s += " — " + e.data[0].slice(0, 72);
        return s;
      }

      function ratioLabel(w, h){
        if(!w || !h) return "—";
        function gcd(a, b){ return b ? gcd(b, a % b) : a; }
        var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
        var named = {
          "16:9":16/9, "4:3":4/3, "21:9":21/9, "1:1":1,
          "9:16":9/16, "3:2":3/2, "5:4":5/4, "2:1":2
        };
        var real = w/h, best = null, bestD = 0.02;
        Object.keys(named).forEach(function(k){
          var d = Math.abs(named[k] - real);
          if(d < bestD){ bestD = d; best = k; }
        });
        if(best) return best;
        if(rw <= 40 && rh <= 40) return rw + ":" + rh;
        return real.toFixed(2) + ":1";
      }

      function injectControls(container, vid){
        var panel = container.querySelector(".shaka-controls-button-panel");
        if(!panel) return false;

        var anchor = panel.querySelector(".shaka-fullscreen-button");
        var fitIdx  = 0;
        var fitBtn  = document.createElement("button");
        fitBtn.className = "sp-btn sp-fit-btn";
        fitBtn.title     = "Video Fit: " + FIT_LABELS.contain;
        fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
        fitBtn.innerHTML = '<span class="fit-pill">—</span>';

        if(anchor) panel.insertBefore(fitBtn, anchor);
        else       panel.appendChild(fitBtn);

        var currentRatio = "—";
        function applyFit(i){
          fitIdx = i;
          var m = FITS[i];
          vid.classList.remove("mode-fill","mode-cover");
          if(m === "fill")  vid.classList.add("mode-fill");
          if(m === "cover") vid.classList.add("mode-cover");
          fitBtn.classList.remove("mode-fill","mode-cover");
          if(m !== "contain") fitBtn.classList.add("mode-" + m);
          fitBtn.title = "Video Fit: " + FIT_LABELS[m];
          var pill = fitBtn.querySelector(".fit-pill");
          if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
        }

        fitBtn.addEventListener("click", function(e){
          e.stopPropagation();
          applyFit((fitIdx + 1) % FITS.length);
        });

        ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
          document.addEventListener(ev, function(){
            if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
          });
        });

        var _ratioTries = 0;
        function updateRatio(){
          var pill = fitBtn.querySelector(".fit-pill");
          if(!pill) return;
          if(vid.videoWidth > 0){
            currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
            if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
            _ratioTries = 0;
          } else if(_ratioTries < 15){
            _ratioTries++;
            setTimeout(updateRatio, 700);
          }
        }

        vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
        vid.addEventListener("resize", updateRatio);
        vid.addEventListener("timeupdate", function onFirstFrame(){
          vid.removeEventListener("timeupdate", onFirstFrame);
          updateRatio();
        });
        updateRatio();

        return true;
      }

      async function startPlayer(m){
        $pc.style.display = "flex";
        shaka.polyfill.installAll();
        if(!shaka.Player.isBrowserSupported()){ errMsg("Browser Not Supported."); return; }

        var player = new shaka.Player();
        await player.attach($vid);

        new shaka.ui.Overlay(player, $pc, $vid).configure({
          controlPanelElements:[
            "play_pause","mute","volume",
            "time_and_duration","spacer",
            "quality","picture_in_picture","fullscreen"
          ],
          seekBarColors:{
            base:    "#828282",
            buffered:"#ffc336",
            played:  "#1fc7ff"
          }
        });

        var _injectCount = 0;
        (function tryInject(){
          if(injectControls($pc, $vid)) return;
          if(++_injectCount < 5) setTimeout(tryInject, 150);
        })();

        var url    = getStreamUrl(m);
        var drmKeys = buildClearKeys(m);

        console.log('🎬 Match:', getMatchTitle(m));
        console.log('📺 URL:', url);
        console.log('🔑 Keys:', Object.keys(drmKeys).length, drmKeys);

        if(!url){
          toast("No stream URL available","err",0);
          return;
        }
        if(Object.keys(drmKeys).length === 0){
          toast("No DRM Keys Available","err",0);
          return;
        }

        var restrictionsRelaxed = false;
        var thermalApplied      = false;
        var sessionStart        = Date.now();

        var thermalTimer = setInterval(function(){
          if(Date.now() - sessionStart < 60*60*1000) return;
          clearInterval(thermalTimer);
          if(thermalApplied) return;
          thermalApplied = true;
          try{
            player.configure("streaming.bufferBehind", 8);
            if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
              player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
            }
          }catch(_){}
        }, 60000);

        function buildCfg(){
          var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
            ? Math.min(PROF.maxH, 720) : PROF.maxH;
          var restr = {};
          if(!restrictionsRelaxed){
            if(effMaxH < 1080) restr.maxHeight    = effMaxH;
            if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
          }
          return {
            drm:{ clearKeys: drmKeys },
            manifest:{
              defaultPresentationDelay:4,
              ignoreTextStreamFailures:true,
              retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
            },
            streaming:{
              lowLatencyMode:false,
              bufferingGoal:PROF.buf,
              rebufferingGoal:PROF.reBuf,
              bufferBehind:PROF.behind,
              safeSeekOffset:4,
              stallEnabled:true,
              stallThreshold:1,
              stallSkip:.3,
              inaccurateManifestTolerance:0,
              retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
            },
            abr:{
              enabled:true,
              defaultBandwidthEstimate:PROF.bwEst,
              switchInterval:4,
              restrictions:restr
            }
          };
        }

        player.configure(buildCfg());

        var T = shaka.net.NetworkingEngine.RequestType;
        player.getNetworkingEngine().registerRequestFilter(function(type, req){
          req.headers["Referer"]    = "https://www.primevideo.com/";
          req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
        });

        var refreshing = false;
        var retries    = 0;
        var edgeTried  = false;
        var lastTry    = 0;
        var started    = false;
        var stallTmr   = null;

        function unmuteOnce(){ $vid.muted = false; }
        $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
        $pc.addEventListener("click",       unmuteOnce, {capture:true,once:true});
        $pc.addEventListener("keydown",     unmuteOnce, {capture:true,once:true});

        function goLiveEdge(){
          if(refreshing) return;
          try{
            player.goToLive();
            edgeTried = true;
            toast("Syncing To Live Edge…","warn",2000);
          }catch(_){ reload(); }
        }

        async function reload(){
          var now = Date.now();
          if(refreshing || now - lastTry < 1500) return;
          if(retries >= 5){ toast("Stream Unavailable. Please Try Again Later.","err",0); return; }
          refreshing = true; lastTry = now; retries++;
          toast("Reconnecting… (" + retries + " / 5)","warn",0);
          try{
            var d     = await loadData();
            var fresh = d.channels.find(function(c){ return c.titleId === m.titleId; });
            if(!fresh) throw new Error("missing");
            var freshKeys = buildClearKeys(fresh);
            var freshUrl  = getStreamUrl(fresh);
            if(Object.keys(freshKeys).length === 0) throw new Error("no_keys");
            if(!freshUrl) throw new Error("no_url");
            drmKeys = freshKeys;
            url     = freshUrl;
            m       = fresh;
            player.configure(buildCfg());
            await player.load(url);
            $vid.play().catch(function(){});
            retries = 0; edgeTried = false;
            toast("Live","live",4000);
          }catch(_){
            setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
          }finally{ refreshing = false; }
        }

        var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

        player.addEventListener("error", function(ev){
          var err  = ev.detail;
          var code = err && err.code;
          if(code === 4014 && !restrictionsRelaxed){
            restrictionsRelaxed = true;
            refreshing = true;
            player.configure(buildCfg());
            toast("Adjusting Quality…","warn",2000);
            player.load(url)
              .then(function(){ $vid.play().catch(function(){}); toast("Live","live",4000); })
              .catch(function(){ reload(); })
              .finally(function(){ refreshing = false; });
            return;
          }
          if(RECOVERABLE.indexOf(code) !== -1){
            toast("Buffering…","warn",0);
            setTimeout(function(){ if(!refreshing) reload(); }, 700);
          } else {
            toast(shakaErrStr(err),"err",6000);
          }
        });

        try{
          setMsg("Loading Stream…");
          toast("Loading Stream…","warn",0);
          await player.load(url);
          hideOverlay();
          toast("Ready — Tap ▶ To Play","ok",5000);
        }catch(_){
          hideOverlay();
          toast("Connection Error — Retrying…","warn",0);
          setTimeout(reload, 1500);
          return;
        }

        function onStall(){
          if(stallTmr) return;
          toast("Buffering…","warn",0);
          if(!started || refreshing) return;
          stallTmr = setTimeout(function(){
            stallTmr = null;
            if(!edgeTried) goLiveEdge(); else reload();
          }, 5000);
        }

        function onPlaying(){
          started = true;
          if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
          edgeTried = false;
          if(!refreshing) toast("Live","live",3000);
        }

        $vid.addEventListener("waiting", onStall);
        $vid.addEventListener("stalled", onStall);
        $vid.addEventListener("playing", onPlaying);
        $vid.addEventListener("error",   function(){
          if(!refreshing){
            toast("Buffering…","warn",0);
            setTimeout(function(){ if(!refreshing) reload(); }, 700);
          }
        });

        document.addEventListener("visibilitychange", function(){
          if(!document.hidden){
            setTimeout(function(){
              if(started && $vid.paused && !refreshing) $vid.play().catch(function(){});
            }, 400);
          }
        });

        var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if(netConn){
          netConn.addEventListener("change", function(){
            if(!player || restrictionsRelaxed) return;
            var t = netConn.effectiveType || "4g";
            var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
            try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
            if(h < PROF.maxH) toast("Slow Network — Reducing Quality","warn",3000);
          });
        }
      }

      async function main(){
        var id = getChId(), data;
        try{
          setMsg("Fetching Matches…");
          data = await loadData();
        }catch(_){
          errMsg("Connection Error. Please Check Your Internet.");
          return;
        }
        if(!data.channels || data.channels.length === 0){
          errMsg("No matches available.");
          return;
        }
        if(!id){ renderList(data.channels); return; }
        var m = data.channels.find(function(c){ return c.titleId === id; });
        if(!m){ errMsg("Match Not Found."); return; }

        if(!m._live || !getStreamUrl(m)){
          toast("⏰ Match not live yet — " + (getMatchTime(m) || "check back soon"), "warn", 5000);
          renderList(data.channels);
          return;
        }

        document.title = getMatchTitle(m);
        await startPlayer(m);
      }

      document.addEventListener("DOMContentLoaded", function() {
        $search.addEventListener("input", function(e) {
          filterChannels(e.target.value);
        });
        main();
      });
    })();
  </script>
