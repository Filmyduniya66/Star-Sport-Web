        :root {
            --bg-primary: #06080d;
            --bg-secondary: #0c1017;
            --accent-cyan: #00c6ff;
            --accent-purple: #7b2fff;
            --accent-blue: #0072ff;

            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --shadow-glow: 0 0 40px rgba(0, 198, 255, 0.15);

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Canvas */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Geometric overlay */
        .geo-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .geo-overlay svg {
            width: 100%;
            height: 100%;
            opacity: 0.12;
        }

        /* Main Wrapper */
        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* Header */
        .hub-header {
            text-align: center;
            margin-bottom: 52px;
            animation: fadeDown 0.8s ease both;
        }

        .hub-logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }

        .hub-icon {
            width: 52px;
            height: 52px;
            animation: spinPulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(0, 198, 255, 0.6));
        }

        .hub-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-primary);
        }

        .hub-title .grad {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hub-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: 8px;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Card */
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px 14px 20px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, var(--card-accent, rgba(0, 198, 255, 0.08)), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--card-accent-solid, var(--accent-cyan)), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }

        .card:hover::before { opacity: 1; }
        .card:hover::after { opacity: 1; }

        .card[data-accent="orange"] { --card-accent: rgba(255, 165, 0, 0.1); --card-accent-solid: #ff9500; }
        .card[data-accent="blue"]   { --card-accent: rgba(0, 114, 255, 0.1); --card-accent-solid: #0072ff; }
        .card[data-accent="red"]    { --card-accent: rgba(255, 50, 50, 0.1);  --card-accent-solid: #ff3232; }
        .card[data-accent="purple"] { --card-accent: rgba(123, 47, 255, 0.1); --card-accent-solid: #7b2fff; }
        .card[data-accent="green"]  { --card-accent: rgba(0, 200, 83, 0.1);   --card-accent-solid: #00c853; }
        .card[data-accent="yellow"] { --card-accent: rgba(255, 214, 0, 0.1);  --card-accent-solid: #ffd600; }

        .live-dot {

        .card-logo-wrap {

        .logo-img img {

        }

        .card:hover .logo-img img {
            transform: scale(1.08);
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
        }

        .logo-fallback {
            font-size: 1.1rem;

        .card-name {

        .hub-footer {

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spinPulse {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card { animation: cardIn 0.7s ease both; }

        /* Respect reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        @media (max-width: 480px) {
            .wrapper { padding: 28px 12px 60px; }
            .hub-title { font-size: 1.3rem; }
            .hub-subtitle { font-size: 0.68rem; letter-spacing: 1.5px; }
            .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card { padding: 20px 10px 16px; border-radius: 16px; }
            .card-logo-wrap { height: 75px; }
            .card-name { font-size: 0.82rem; }
            .btn-explore { padding: 7px 14px; font-size: 0.65rem; }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .wrapper { padding: 32px 16px 60px; }
            .hub-title { font-size: 1.5rem; }
            .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 1025px) {
            .cards-grid { grid-template-columns: repeat(4, 1fr); }
        }

        ::-webkit-scrollbar { width: 6px; }

        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

  <script>
        /* ------------------------------------------------------------------

        const HUBS = [
            { name: "FanCode",            subtitle: "India", url: "FanCode/",  logo: "https://sportlink.pages.dev/logos/fancode.jpg",      accent: "orange" },
            { name: "Jio TV +",           subtitle: "India", url: "https://sportlink-jtv.pages.dev/",        logo: "https://filmyduniya66.github.io/Star-Sport-Web/JioTv/",    accent: "blue"   },
            { name: "Sony Network All",       subtitle: "India", url: "https://filmyduniya66.github.io/Star-Sport-Web/Sony_24%C3%977/",     logo: "https://sportlink.pages.dev/logos/SonyLIV.jpg",      accent: "blue"   },
            { name: "ZEE Network",        subtitle: "India", url: "Zee",      logo: "https://sportlink.pages.dev/logos/zee.png",          accent: "blue"   },
             { name: "VZY",        subtitle: "India", url: "https://filmyduniya66.github.io/Star-Sport-Web/Zee5/Vzy/",      logo: "https://sportlink.pages.dev/logos/zee.png",          accent: "blue"   },
            { name: "Star Sports",        subtitle: "India", url: "https://filmyduniya66.github.io/Star-Sport-Web/Live%20Channels/",     logo: "https://sportlink.pages.dev/logos/starsports.jpg",   accent: "red"    },
            { name: "Willow Sports",      subtitle: "India", url: "Willow",   logo: "https://sportlink.pages.dev/logos/willow.jpg",       accent: "blue"   },
            { name: "Kids",               subtitle: "India", url: "Kids Channel",      logo: "https://sportlink.pages.dev/logos/kid.jpg",          accent: "yellow" },
            { name: "Star Sports 2",      subtitle: "India", url: "Star Sports Channel",    logo: "https://sportlink.pages.dev/logos/starsports.jpg",   accent: "red"    },
            { name: "FanCode IOS",        subtitle: "India", url: "FanCode",      logo: "https://sportlink.pages.dev/logos/fancode.jpg",      accent: "orange" },
            { name: "Sport",              subtitle: "India", url: "Sports",    logo: "https://sportlink.pages.dev/logos/sportlink.jpg",    accent: "blue"   },
            { name: "Jio TV + 2",         subtitle: "India", url: "JioTV",     logo: "https://sportlink.pages.dev/logos/Jio%20Tv+.jpg",    accent: "blue"   },
            { name: "Sony Network",       subtitle: "India", url: "SonyLiv/",     logo: "https://sportlink.pages.dev/logos/SonyLIV.jpg",      accent: "blue"   }
        ];

        /* ------------------------------------------------------------------
           RENDER
        ------------------------------------------------------------------ */
        function renderCards(hubs, grid) {
            const frag = document.createDocumentFragment();

            hubs.forEach((hub, index) => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = hub.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.setAttribute('data-accent', hub.accent || 'blue');
                card.style.animationDelay = `${(index + 1) * 0.08}s`;

                card.innerHTML = `
                    <div class="live-dot"></div>
                    <div class="card-logo-wrap">
                        <div class="logo-img">
                            <img src="${hub.logo}" alt="${hub.name} logo" loading="lazy">
                        </div>
                    </div>
                    <div class="card-name">${hub.name}<small>${hub.subtitle}</small></div>
                    <span class="btn-explore">Explore</span>
                `;

                const img = card.querySelector('img');
                img.addEventListener('error', () => {
                    const wrap = card.querySelector('.logo-img');
                    wrap.innerHTML = '';
                    const span = document.createElement('span');
                    span.className = 'logo-fallback';
                    span.textContent = hub.name;
                    wrap.appendChild(span);
                }, { once: true });

                frag.appendChild(card);
            });

            grid.innerHTML = '';
            grid.appendChild(frag);
        }

        /* ------------------------------------------------------------------
           PARTICLE BACKGROUND
        ------------------------------------------------------------------ */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const DOTS = [];
        const DOT_COUNT = 90;
        const MAX_DIST = 140;
        let animId = null;
        let running = true;

        function initCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            DOTS.length = 0;
            for (let i = 0; i < DOT_COUNT; i++) {
                DOTS.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 2 + 0.8,
                    alpha: Math.random() * 0.4 + 0.15
                });
            }
        }

        function draw() {
            if (!running) return;
            ctx.clearRect(0, 0, W, H);

            DOTS.forEach(d => {
                d.x += d.vx;
                d.y += d.vy;
                if (d.x < 0) d.x = W;
                if (d.x > W) d.x = 0;
                if (d.y < 0) d.y = H;
                if (d.y > H) d.y = 0;

                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0,198,255,${d.alpha})`;
                ctx.fill();
            });

            for (let i = 0; i < DOTS.length; i++) {
                for (let j = i + 1; j < DOTS.length; j++) {
                    const dx = DOTS[i].x - DOTS[j].x;
                    const dy = DOTS[i].y - DOTS[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MAX_DIST) {
                        ctx.beginPath();
                        ctx.moveTo(DOTS[i].x, DOTS[i].y);
                        ctx.lineTo(DOTS[j].x, DOTS[j].y);
                        ctx.strokeStyle = `rgba(0,198,255,${0.07 * (1 - dist / MAX_DIST)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            animId = requestAnimationFrame(draw);
        }

        // Pause animation when tab is hidden (saves CPU/battery)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                running = false;
                if (animId) cancelAnimationFrame(animId);
            } else {
                running = true;
                draw();
            }
        });

        window.addEventListener('resize', () => {
            initCanvas();
        });

        /* ------------------------------------------------------------------
           BOOT
        ------------------------------------------------------------------ */
        const grid = document.getElementById('hubs-grid');

        // Directly render embedded HUBS — no phantom hubs.json request
        renderCards(HUBS, grid);
        initCanvas();
        draw();
    </script>
