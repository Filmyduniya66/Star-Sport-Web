<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">

<title>Star Sports Web</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.min.css">

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#05070b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,input{
  font:inherit;
}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,7,11,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:12px;
}

.topbar-inner{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-title{
  font-size:18px;
  font-weight:900;
  white-space:nowrap;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  height:40px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  background:#10141c;
  color:#fff;
  padding:0 13px;
  outline:none;
}

.search input:focus{
  border-color:#3b82f6;
}

.groups{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-top:10px;
  scrollbar-width:none;
}

.groups::-webkit-scrollbar{
  display:none;
}

.group-btn{
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.1);
  background:#10141c;
  color:#cbd5e1;
  border-radius:20px;
  padding:7px 12px;
  font-size:11px;
  font-weight:700;
}

.group-btn.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

#channel-list{
  padding:12px;
}

#ch-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.ch-card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  min-height:155px;
  padding:10px;
  border-radius:15px;
  background:linear-gradient(145deg,#111722,#0b0f16);
  border:1px solid rgba(255,255,255,.07);
  color:#fff;
  text-decoration:none;
  overflow:hidden;
  transition:.2s;
}

.ch-card:active{
  transform:scale(.97);
}

.ch-card .accent{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:#2563eb;
}

.ch-card .number{
  position:absolute;
  top:8px;
  left:8px;
  min-width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  background:rgba(0,0,0,.6);
  font-size:9px;
  font-weight:800;
  z-index:2;
}

.ch-card .group-badge{
  position:absolute;
  top:8px;
  right:8px;
  max-width:75px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  padding:4px 7px;
  border-radius:8px;
  background:rgba(37,99,235,.15);
  color:#60a5fa;
  font-size:7px;
  font-weight:800;
  z-index:2;
}

.ch-logo{
  width:100px;
  height:70px;
  object-fit:contain;
  margin-top:15px;
  border-radius:10px;
  background:#080b10;
}

.ch-initials{
  width:100px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:15px;
  border-radius:10px;
  background:#151b26;
  font-size:22px;
  font-weight:900;
  color:#64748b;
}

.ch-name{
  width:100%;
  margin-top:8px;
  text-align:center;
  font-size:11px;
  font-weight:800;
  line-height:1.35;
  color:#f8fafc;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.fancode-card{
  min-height:190px;
}

.fancode-card .ch-logo{
  width:100%;
  max-width:180px;
  height:95px;
  max-height:95px;
  object-fit:cover;
  border-radius:12px;
}

.fancode-teams{
  width:100%;
  margin-top:5px;
  text-align:center;
  font-size:10px;
  font-weight:700;
  line-height:1.4;
  color:#cbd5e1;
}

.fancode-status{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:5px;
  padding:3px 8px;
  border-radius:10px;
  background:rgba(239,68,68,.15);
  color:#f87171;
  font-size:8px;
  font-weight:800;
}

.empty{
  grid-column:1/-1;
  padding:40px 15px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}

#pc{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  background:#000;
}

#pc.show{
  display:block;
}

.player-head{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
}

.back-btn{
  width:38px;
  height:38px
