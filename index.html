<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>FanCode Live Events</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#fff;
  font-family:Arial, sans-serif;
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  padding:16px;
  background:#0d111b;
  border-bottom:1px solid #202636;
}

.header h1{
  margin:0;
  font-size:22px;
}

.header p{
  margin:6px 0 0;
  color:#9da6b8;
  font-size:13px;
}

.search{
  margin-top:12px;
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #293143;
  background:#141a26;
  color:#fff;
  outline:none;
}

.container{
  padding:15px;
  max-width:1100px;
  margin:auto;
}

.status{
  margin-bottom:14px;
  color:#9da6b8;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:14px;
}

.card{
  overflow:hidden;
  border:1px solid #242c3d;
  border-radius:14px;
  background:#10151f;
}

.poster{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  background:#171d29;
}

.info{
  padding:13px;
}

.category{
  color:#8ea2ff;
  font-size:11px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.title{
  font-size:15px;
  font-weight:700;
  line-height:1.35;
}

.teams{
  margin-top:8px;
  color:#c4cad6;
  font-size:13px;
}

.live{
  display:inline-block;
  margin-top:10px;
  padding:4px 8px;
  border-radius:5px;
  background:#d71920;
  color:white;
  font-size:11px;
  font-weight:bold;
}

.time{
  margin-top:7px;
  color:#8993a6;
  font-size:12px;
}

.watch{
  display:block;
  width:100%;
  margin-top:12px;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#080b12;
  font-weight:bold;
  text-align:center;
  cursor:pointer;
}

.error{
  padding:20px;
  border:1px solid #4a2630;
  border-radius:10px;
  color:#ff9da8;
  background:#211218;
}
</style>
</head>

<body>

<header class="header">
  <h1>🏏 FanCode Live Events</h1>
  <p>Live matches and sports events</p>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search match, team or tournament..."
  >
</header>

<main class="container">

  <div id="status" class="status">
    Loading events...
  </div>

  <div id="events" class="grid"></div>

</main>

<script>

const API =
"https://raw.githubusercontent.com/drmlive/fancode-live-events/refs/heads/main/fancode.json";

let matches = [];


/* ------------------------------
   Load JSON
------------------------------ */

async function loadData(){

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("events");

  try{

    status.textContent =
      "Loading events...";

    const response =
      await fetch(API,{
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      });

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data =
      await response.json();

    if(
      !data ||
      !Array.isArray(data.matches)
    ){

      throw new Error(
        "Invalid FanCode JSON format"
      );

    }

    matches = data.matches;

    render(matches);

    status.textContent =
      matches.length +
      " events loaded";

  }catch(error){

    console.error(error);

    status.textContent = "";

    container.innerHTML = `
      <div class="error">
        Failed to load events.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }
}


/* ------------------------------
   Render cards
------------------------------ */

function render(list){

  const container =
    document.getElementById("events");

  if(!list.length){

    container.innerHTML = `
      <div class="error">
        No matching events found.
      </div>
    `;

    return;
  }

  container.innerHTML =
    list.map((match,index)=>{

      const image =
        match.src || "";

      const title =
        match.match_name ||
        match.title ||
        "Unknown Match";

      const category =
        match.event_category ||
        "Sports";

      const team1 =
        match.team_1 || "";

      const team2 =
        match.team_2 || "";

      const status =
        match.status || "";

      const start =
        match.startTime || "";

      return `

        <article class="card">

          ${
            image
            ? `
              <img
                class="poster"
                src="${escapeAttr(image)}"
                alt="${escapeAttr(title)}"
                loading="lazy"
                onerror="this.style.display='none'"
              >
            `
            : ""
          }

          <div class="info">

            <div class="category">
              ${escapeHTML(category)}
            </div>

            <div class="title">
              ${escapeHTML(title)}
            </div>

            ${
              team1 || team2
              ? `
                <div class="teams">
                  ${escapeHTML(team1)}
                  ${
                    team1 && team2
                    ? " vs "
                    : ""
                  }
                  ${escapeHTML(team2)}
                </div>
              `
              : ""
            }

            ${
              status
              ? `
                <span class="live">
                  ${escapeHTML(status)}
                </span>
              `
              : ""
            }

            ${
              start
              ? `
                <div class="time">
                  ${escapeHTML(start)}
                </div>
              `
              : ""
            }

            <button
              class="watch"
              onclick="watchEvent(${index})"
            >
              View Event
            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* ------------------------------
   Search
------------------------------ */

document
  .getElementById("search")
  .addEventListener("input",function(){

    const q =
      this.value
        .toLowerCase()
        .trim();

    if(!q){

      render(matches);

      document.getElementById("status")
        .textContent =
        matches.length +
        " events loaded";

      return;
    }

    const filtered =
      matches.filter(match=>{

        const text = [

          match.match_name,
          match.title,
          match.event_name,
          match.event_category,
          match.team_1,
          match.team_2,
          match.status

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(q);

      });

    render(filtered);

    document.getElementById("status")
      .textContent =
      filtered.length +
      " matching events";

  });


/* ------------------------------
   Event action
------------------------------ */

function watchEvent(index){

  const match =
    matches[index];

  if(!match){
    return;
  }

  /*
    The JSON contains stream fields such as
    dai_url/adfree_url.

    This example does not automatically
    bypass authentication, DRM, cookies,
    or access restrictions.
  */

  const url =
    match.adfree_url ||
    match.dai_url ||
    "";

  if(!url){

    alert(
      "No playable stream URL is available."
    );

    return;
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* ------------------------------
   Security helpers
------------------------------ */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return escapeHTML(value);

}


/* ------------------------------
   Start
------------------------------ */

loadData();

</script>

</body>
</html>
